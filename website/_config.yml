# Jekyll configuration for the SARIT corpus search site.
# The site source lives in /website; the text data (website/data) is generated
# by _tools/extract.py during the GitHub Actions build and is not committed.
title: SARIT Corpus Search
description: >-
  Search the SARIT and GRETIL TEI corpus of Sanskrit and other Indian-language
  texts in IAST or Devanagari, with scholarly references for every hit.
baseurl: "/SARIT-corpus"   # the repository name; change if the repo is renamed
url: "https://wujastyk.github.io"
repository: wujastyk/SARIT-corpus
branch: main
markdown: kramdown
exclude:
  - _tools
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
