<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    window.SARIT_SITE = {
      base: "{{ '/' | relative_url }}",
      repo: "https://github.com/{{ site.repository }}",
      branch: "{{ site.branch }}"
    };
  </script>
</head>
<body class="page-{{ page.slug | default: 'plain' }}">
  <header class="site-head">
    <div class="wrap head-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">॥</span>
        <span class="brand-text">SARIT and GRETIL Corpus Search</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.slug == 'search' %}aria-current="page"{% endif %}>Search</a>
        <a href="{{ '/texts.html' | relative_url }}" {% if page.slug == 'texts' %}aria-current="page"{% endif %}>Texts</a>
        <a href="{{ '/help.html' | relative_url }}" {% if page.slug == 'help' %}aria-current="page"{% endif %}>Help</a>
        <a href="{{ '/about.html' | relative_url }}" {% if page.slug == 'about' %}aria-current="page"{% endif %}>About</a>
        <a href="https://github.com/{{ site.repository }}">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-foot">
    <div class="wrap">
      Texts: <a href="https://github.com/{{ site.repository }}">{{ site.repository }}</a>
      (SARIT and GRETIL TEI files; see each text's header for its licence).
      Search runs entirely in your browser.
    </div>
  </footer>
  {% for s in page.scripts %}<script src="{{ s | relative_url }}"></script>
  {% endfor %}
</body>
</html>
